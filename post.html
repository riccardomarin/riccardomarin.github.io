<!doctype html>
<!-- Template for every blog post: shows blog/<name>.md for post.html?p=<name>. No need to edit. -->
<html lang="en" data-palette="accent">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog — Riccardo Marin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..600;1,400..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>try { if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}</script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
  <script src="site.js" defer></script>
  <!-- visit counter: dashboard at https://riccardomarin.goatcounter.com -->
  <script data-goatcounter="https://riccardomarin.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
  <main>
    <div class="post-head">
      <span class="back"><a href="./#blog">← Riccardo Marin</a></span>
      <button class="theme-toggle" type="button">dark</button>
    </div>
    <article id="post"></article>
    <footer>© 2026 Riccardo Marin</footer>
  </main>
</body>
</html>
